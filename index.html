<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiBoard - Mur Collaboratif</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .editor-content:empty:before {
      content: attr(placeholder);
      color: #9ca3af;
      pointer-events: none;
      display: block;
    }
    .editor-content ul { list-style-type: disc; padding-left: 1.25rem; }
    .editor-content ol { list-style-type: decimal; padding-left: 1.25rem; }
    .editor-content blockquote { border-left: 3px solid #cbd5e1; padding-left: 0.75rem; font-style: italic; color: #475569; }
    .editor-content code { background-color: rgba(0,0,0,0.06); padding: 0.15rem 0.3rem; border-radius: 0.25rem; font-size: 0.85em; }
    .note-card {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
    }
    .note-card:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm px-4 lg:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand & Status -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
          <i class="ph-bold ph-chalkboard text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
            DigiBoard
            <span id="syncStatus" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
              En ligne
            </span>
          </h1>
          <p class="text-xs text-slate-500">Mur de notes synchronisé en temps réel</p>
        </div>
      </div>

      <!-- Controls & Search -->
      <div class="flex items-center flex-1 max-w-md mx-2">
        <div class="relative w-full">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Rechercher par texte ou #tag..." 
            class="w-full pl-9 pr-4 py-2 bg-slate-50 hover:bg-slate-100/80 focus:bg-white text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all"
          >
        </div>
      </div>

      <!-- Action Button -->
      <div class="flex items-center gap-2">
        <button 
          id="btnNewNote"
          class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-4 py-2 rounded-xl shadow-sm hover:shadow transition-all transform active:scale-95"
        >
          <i class="ph-bold ph-plus text-lg"></i>
          <span class="hidden sm:inline">Ajouter une note</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Tags Bar -->
  <section id="tagsBarContainer" class="bg-white/60 border-b border-slate-200/80 px-4 lg:px-8 py-2 hidden">
    <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto text-xs py-1" id="tagsList">
      <!-- Dynamic Tags -->
    </div>
  </section>

  <!-- Main Wall -->
  <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full">
    
    <!-- Notes Grid -->
    <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
      <!-- Loading Skeleton -->
      <div class="col-span-full py-20 flex flex-col items-center justify-center text-slate-400">
        <i class="ph-bold ph-spinner animate-spin text-4xl text-indigo-500 mb-3"></i>
        <p class="text-sm">Connexion à Firestore et chargement du mur...</p>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden py-24 text-center">
      <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
        <i class="ph-bold ph-note-pencil"></i>
      </div>
      <h3 class="text-base font-semibold text-slate-800 mb-1">Votre mur est vide</h3>
      <p class="text-sm text-slate-500 max-w-sm mx-auto mb-5">Soyez le premier à ajouter une note formatée, coller une image ou partager une idée !</p>
      <button onclick="document.getElementById('btnNewNote').click()" class="inline-flex items-center gap-2 text-indigo-600 font-semibold text-sm hover:text-indigo-700">
        <i class="ph-bold ph-plus-circle text-lg"></i>
        Créer une première note
      </button>
    </div>

  </main>

  <!-- Note Modal Editor -->
  <div id="noteModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col my-auto transition-all animate-in fade-in zoom-in-95 duration-150">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/60">
        <h2 id="modalTitle" class="text-lg font-bold text-slate-900">Nouvelle note</h2>
        <button id="btnCloseModal" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 transition-colors">
          <i class="ph-bold ph-x text-lg"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 space-y-4">
        
        <!-- Note Title & Author -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <input 
              type="text" 
              id="inputNoteTitle" 
              placeholder="Titre de la publication..." 
              class="w-full text-base font-semibold text-slate-900 placeholder:text-slate-400 px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
            >
          </div>
          <div>
            <input 
              type="text" 
              id="inputNoteAuthor" 
              placeholder="Auteur (optionnel)" 
              class="w-full text-sm text-slate-700 placeholder:text-slate-400 px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
            >
          </div>
        </div>

        <!-- Rich Text Toolbar (Digipad style) -->
        <div class="border border-slate-200 rounded-xl overflow-hidden focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all">
          <div class="flex flex-wrap items-center gap-0.5 bg-slate-50 border-b border-slate-200 p-1.5 text-slate-700">
            <button type="button" data-cmd="bold" title="Gras" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base"><i class="ph-bold ph-text-b"></i></button>
            <button type="button" data-cmd="italic" title="Italique" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base"><i class="ph-bold ph-text-italic"></i></button>
            <button type="button" data-cmd="underline" title="Souligné" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base"><i class="ph-bold ph-text-underline"></i></button>
            <button type="button" data-cmd="strikeThrough" title="Barré" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base"><i class="ph-bold ph-text-strikethrough"></i></button>
            <div class="w-px h-4 bg-slate-300 mx-1"></div>
            <button type="button" data-cmd="formatBlock" data-val="h2" title="Titre 2" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base font-bold">H2</button>
            <button type="button" data-cmd="formatBlock" data-val="h3" title="Titre 3" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base font-bold">H3</button>
            <div class="w-px h-4 bg-slate-300 mx-1"></div>
            <button type="button" data-cmd="insertUnorderedList" title="Puces" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base"><i class="ph-bold ph-list-bullets"></i></button>
            <button type="button" data-cmd="insertOrderedList" title="Numéros" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base"><i class="ph-bold ph-list-numbers"></i></button>
            <button type="button" data-cmd="formatBlock" data-val="blockquote" title="Citation" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base"><i class="ph-bold ph-quotes"></i></button>
            <div class="w-px h-4 bg-slate-300 mx-1"></div>
            <button type="button" id="btnInsertLink" title="Insérer un lien" class="p-1.5 hover:bg-slate-200 rounded text-base"><i class="ph-bold ph-link"></i></button>
            <button type="button" data-cmd="removeFormat" title="Effacer mise en forme" class="btn-tool p-1.5 hover:bg-slate-200 rounded text-base text-rose-500"><i class="ph-bold ph-text-align-justify"></i></button>
          </div>

          <!-- WYSIWYG Editable Area -->
          <div 
            id="editorContent" 
            contenteditable="true" 
            placeholder="Écrivez le contenu de votre note ici..." 
            class="editor-content p-4 min-h-[160px] max-h-[300px] overflow-y-auto focus:outline-none text-sm text-slate-800 leading-relaxed"
          ></div>
        </div>

        <!-- Attachment (Image URL or Upload preview) -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center justify-between">
            <span>Illustration (Optionnelle)</span>
            <span class="text-slate-400 font-normal">URL ou image locale</span>
          </label>
          <div class="flex gap-2">
            <input 
              type="url" 
              id="inputImageUrl" 
              placeholder="https://exemple.com/image.jpg" 
              class="flex-1 text-sm px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
            >
            <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-sm flex items-center gap-1.5 transition-colors border border-slate-200">
              <i class="ph-bold ph-upload-simple"></i>
              <span>Fichier</span>
              <input type="file" id="inputFileUpload" accept="image/*" class="hidden">
            </label>
          </div>
          <div id="imagePreviewContainer" class="hidden relative rounded-xl overflow-hidden border border-slate-200 max-h-48 bg-slate-50">
            <img id="imagePreview" src="" alt="Aperçu" class="w-full h-48 object-cover">
            <button id="btnRemoveImage" class="absolute top-2 right-2 bg-slate-900/60 hover:bg-slate-900 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs">
              <i class="ph-bold ph-trash"></i>
            </button>
          </div>
        </div>

        <!-- Card Color & Tags -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
          <!-- Colors -->
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-2">Couleur de la carte</label>
            <div class="flex items-center gap-2" id="colorPickerGroup">
              <button type="button" data-color="white" class="color-dot w-7 h-7 rounded-full bg-white border-2 border-indigo-600 ring-2 ring-indigo-500/20 shadow-sm"></button>
              <button type="button" data-color="yellow" class="color-dot w-7 h-7 rounded-full bg-amber-100 border-2 border-transparent hover:scale-105 transition-transform"></button>
              <button type="button" data-color="blue" class="color-dot w-7 h-7 rounded-full bg-sky-100 border-2 border-transparent hover:scale-105 transition-transform"></button>
              <button type="button" data-color="green" class="color-dot w-7 h-7 rounded-full bg-emerald-100 border-2 border-transparent hover:scale-105 transition-transform"></button>
              <button type="button" data-color="rose" class="color-dot w-7 h-7 rounded-full bg-rose-100 border-2 border-transparent hover:scale-105 transition-transform"></button>
              <button type="button" data-color="purple" class="color-dot w-7 h-7 rounded-full bg-purple-100 border-2 border-transparent hover:scale-105 transition-transform"></button>
            </div>
          </div>
          <!-- Tags -->
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-2">Étiquettes (#tags)</label>
            <input 
              type="text" 
              id="inputNoteTags" 
              placeholder="ex: projet, urgent, cours (séparés par virgules)" 
              class="w-full text-sm px-3 py-1.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
            >
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
        <button id="btnDeleteNote" class="hidden text-rose-600 hover:text-rose-700 text-sm font-semibold flex items-center gap-1.5">
          <i class="ph-bold ph-trash"></i>
          Supprimer
        </button>
        <div class="flex items-center gap-2 ml-auto">
          <button id="btnCancelModal" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-200/60 transition-colors">
            Annuler
          </button>
          <button id="btnSaveNote" class="px-5 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm flex items-center gap-2 transition-all">
            <span id="btnSaveSpinner" class="hidden"><i class="ph-bold ph-spinner animate-spin"></i></span>
            <span>Enregistrer</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- FIREBASE MODULE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      serverTimestamp,
      query,
      orderBy 
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    // Votre configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDZWyn3dsAWfz1qX1RTmYnQPmhWYJjU_8g",
      authDomain: "mon-digipad.firebaseapp.com",
      projectId: "mon-digipad",
      storageBucket: "mon-digipad.firebasestorage.app",
      messagingSenderId: "148680541361",
      appId: "1:148680541361:web:6e5146e0b7581d8aae4e90",
      measurementId: "G-TPY9CVBMNL"
    };

    // Initialisation Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const notesCollection = collection(db, "digipad_notes");

    // Palette mapping Tailwind
    const COLOR_CLASSES = {
      white: "bg-white border-slate-200/80",
      yellow: "bg-amber-50/90 border-amber-200/80",
      blue: "bg-sky-50/90 border-sky-200/80",
      green: "bg-emerald-50/90 border-emerald-200/80",
      rose: "bg-rose-50/90 border-rose-200/80",
      purple: "bg-purple-50/90 border-purple-200/80"
    };

    // Global State
    let notes = [];
    let activeEditingId = null;
    let selectedColor = "white";
    let activeTagFilter = null;
    let searchQuery = "";

    // DOM Elements
    const notesContainer = document.getElementById("notesContainer");
    const emptyState = document.getElementById("emptyState");
    const noteModal = document.getElementById("noteModal");
    const modalTitle = document.getElementById("modalTitle");
    const btnNewNote = document.getElementById("btnNewNote");
    const btnCloseModal = document.getElementById("btnCloseModal");
    const btnCancelModal = document.getElementById("btnCancelModal");
    const btnSaveNote = document.getElementById("btnSaveNote");
    const btnSaveSpinner = document.getElementById("btnSaveSpinner");
    const btnDeleteNote = document.getElementById("btnDeleteNote");
    const syncStatus = document.getElementById("syncStatus");

    const inputNoteTitle = document.getElementById("inputNoteTitle");
    const inputNoteAuthor = document.getElementById("inputNoteAuthor");
    const editorContent = document.getElementById("editorContent");
    const inputImageUrl = document.getElementById("inputImageUrl");
    const inputFileUpload = document.getElementById("inputFileUpload");
    const imagePreviewContainer = document.getElementById("imagePreviewContainer");
    const imagePreview = document.getElementById("imagePreview");
    const btnRemoveImage = document.getElementById("btnRemoveImage");
    const inputNoteTags = document.getElementById("inputNoteTags");
    const colorPickerGroup = document.getElementById("colorPickerGroup");
    const searchInput = document.getElementById("searchInput");
    const tagsBarContainer = document.getElementById("tagsBarContainer");
    const tagsList = document.getElementById("tagsList");

    // 1. Live Sync avec Firestore (onSnapshot)
    const q = query(notesCollection, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      notes = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));
      updateSyncStatus(true);
      renderBoard();
      updateTagsBar();
    }, (error) => {
      console.error("Erreur Firestore :", error);
      updateSyncStatus(false);
    });

    function updateSyncStatus(online) {
      if (online) {
        syncStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800";
        syncStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span> Synchronisé`;
      } else {
        syncStatus.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-100 text-rose-800";
        syncStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-600"></span> Hors ligne / Erreur`;
      }
    }

    // 2. Render Cards
    function renderBoard() {
      // Filtrage par texte et tag
      let filtered = notes.filter(n => {
        const matchTag = !activeTagFilter || (n.tags && n.tags.includes(activeTagFilter));
        const fullText = `${n.title || ''} ${n.content || ''} ${n.author || ''} ${(n.tags || []).join(' ')}`.toLowerCase();
        const matchSearch = !searchQuery || fullText.includes(searchQuery.toLowerCase());
        return matchTag && matchSearch;
      });

      if (filtered.length === 0) {
        notesContainer.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      notesContainer.innerHTML = filtered.map(note => {
        const colorClass = COLOR_CLASSES[note.color] || COLOR_CLASSES.white;
        const tagsHtml = (note.tags || []).map(t => `
          <span class="inline-block px-2 py-0.5 text-[11px] font-medium bg-slate-900/5 hover:bg-slate-900/10 text-slate-600 rounded-md cursor-pointer transition-colors" onclick="window.filterByTag('${t}')">
            #${t}
          </span>
        `).join("");

        const imageHtml = note.imageUrl ? `
          <div class="relative overflow-hidden aspect-video bg-slate-100 border-b border-inherit">
            <img src="${note.imageUrl}" alt="" class="w-full h-full object-cover loading="lazy" onerror="this.parentElement.style.display='none'">
          </div>
        ` : '';

        const authorText = note.author ? `<span class="text-xs text-slate-500 font-medium">${escapeHtml(note.author)}</span>` : '';
        const likesCount = note.likes || 0;

        return `
          <div class="note-card ${colorClass} rounded-2xl border shadow-sm flex flex-col justify-between overflow-hidden group cursor-pointer" onclick="window.editNote('${note.id}')">
            <div>
              ${imageHtml}
              <div class="p-5">
                ${note.title ? `<h3 class="font-bold text-slate-900 text-base mb-2 leading-snug">${escapeHtml(note.title)}</h3>` : ''}
                <div class="text-sm text-slate-700 leading-relaxed break-words space-y-2 mb-3">
                  ${note.content || ''}
                </div>
                ${tagsHtml ? `<div class="flex flex-wrap gap-1.5 mt-3 pt-2 border-t border-slate-900/5">${tagsHtml}</div>` : ''}
              </div>
            </div>

            <!-- Card Bottom Bar -->
            <div class="px-5 py-3 border-t border-inherit flex items-center justify-between bg-black/[0.02]" onclick="event.stopPropagation()">
              ${authorText}
              <div class="flex items-center gap-1.5 ml-auto">
                <button onclick="window.toggleLike('${note.id}', ${likesCount})" class="flex items-center gap-1 text-xs font-semibold text-slate-600 hover:text-rose-600 px-2 py-1 rounded-lg hover:bg-black/5 transition-all">
                  <i class="ph-fill ph-heart ${likesCount > 0 ? 'text-rose-500' : 'text-slate-400'} text-sm"></i>
                  <span>${likesCount}</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // 3. Barre de tags dynamique
    function updateTagsBar() {
      const allTags = new Set();
      notes.forEach(n => (n.tags || []).forEach(t => allTags.add(t)));
      
      if (allTags.size === 0) {
        tagsBarContainer.classList.add("hidden");
        return;
      }

      tagsBarContainer.classList.remove("hidden");
      let html = `
        <button onclick="window.filterByTag(null)" class="px-3 py-1 rounded-full font-medium transition-all ${!activeTagFilter ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          Tous (${notes.length})
        </button>
      `;
      allTags.forEach(tag => {
        const count = notes.filter(n => (n.tags || []).includes(tag)).length;
        const isActive = activeTagFilter === tag;
        html += `
          <button onclick="window.filterByTag('${tag}')" class="px-3 py-1 rounded-full font-medium transition-all ${isActive ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
            #${tag} <span class="opacity-70 text-[10px]">(${count})</span>
          </button>
        `;
      });
      tagsList.innerHTML = html;
    }

    // Modal Control
    function openModal(note = null) {
      if (note) {
        activeEditingId = note.id;
        modalTitle.textContent = "Modifier la note";
        inputNoteTitle.value = note.title || "";
        inputNoteAuthor.value = note.author || "";
        editorContent.innerHTML = note.content || "";
        inputImageUrl.value = note.imageUrl || "";
        inputNoteTags.value = (note.tags || []).join(", ");
        selectedColor = note.color || "white";
        btnDeleteNote.classList.remove("hidden");
        if (note.imageUrl) {
          imagePreview.src = note.imageUrl;
          imagePreviewContainer.classList.remove("hidden");
        } else {
          imagePreviewContainer.classList.add("hidden");
        }
      } else {
        activeEditingId = null;
        modalTitle.textContent = "Nouvelle note";
        inputNoteTitle.value = "";
        inputNoteAuthor.value = localStorage.getItem("digipad_last_author") || "";
        editorContent.innerHTML = "";
        inputImageUrl.value = "";
        inputNoteTags.value = "";
        selectedColor = "white";
        btnDeleteNote.classList.add("hidden");
        imagePreviewContainer.classList.add("hidden");
      }
      refreshColorSelection();
      noteModal.classList.remove("hidden");
      noteModal.classList.add("flex");
      editorContent.focus();
    }

    function closeModal() {
      noteModal.classList.add("hidden");
      noteModal.classList.remove("flex");
      activeEditingId = null;
    }

    // Color Selector
    function refreshColorSelection() {
      document.querySelectorAll(".color-dot").forEach(btn => {
        const c = btn.getAttribute("data-color");
        if (c === selectedColor) {
          btn.classList.add("border-indigo-600", "ring-2", "ring-indigo-500/20");
          btn.classList.remove("border-transparent");
        } else {
          btn.classList.remove("border-indigo-600", "ring-2", "ring-indigo-500/20");
          btn.classList.add("border-transparent");
        }
      });
    }

    colorPickerGroup.addEventListener("click", (e) => {
      const btn = e.target.closest(".color-dot");
      if (!btn) return;
      selectedColor = btn.getAttribute("data-color");
      refreshColorSelection();
    });

    // Save Note to Firestore
    btnSaveNote.addEventListener("click", async () => {
      const title = inputNoteTitle.value.trim();
      const content = editorContent.innerHTML.trim();
      const author = inputNoteAuthor.value.trim();
      const imageUrl = inputImageUrl.value.trim();
      const rawTags = inputNoteTags.value.split(",").map(t => t.trim().replace(/^#/, "")).filter(Boolean);

      if (!title && !content && !imageUrl) {
        alert("Veuillez saisir un titre, du contenu ou une image.");
        return;
      }

      if (author) {
        localStorage.setItem("digipad_last_author", author);
      }

      btnSaveSpinner.classList.remove("hidden");
      btnSaveNote.disabled = true;

      try {
        const notePayload = {
          title,
          content,
          author,
          imageUrl,
          tags: rawTags,
          color: selectedColor,
          updatedAt: serverTimestamp()
        };

        if (activeEditingId) {
          await updateDoc(doc(db, "digipad_notes", activeEditingId), notePayload);
        } else {
          notePayload.createdAt = serverTimestamp();
          notePayload.likes = 0;
          await addDoc(notesCollection, notePayload);
        }

        confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
        closeModal();
      } catch (err) {
        console.error("Erreur de sauvegarde:", err);
        alert("Une erreur est survenue lors de l'enregistrement. Vérifiez vos règles de sécurité Firestore.");
      } finally {
        btnSaveSpinner.classList.add("hidden");
        btnSaveNote.disabled = false;
      }
    });

    // Delete Note
    btnDeleteNote.addEventListener("click", async () => {
      if (!activeEditingId) return;
      if (confirm("Voulez-vous vraiment supprimer cette note ?")) {
        try {
          await deleteDoc(doc(db, "digipad_notes", activeEditingId));
          closeModal();
        } catch (err) {
          console.error("Erreur suppression:", err);
          alert("Erreur lors de la suppression.");
        }
      }
    });

    // Image handling
    inputImageUrl.addEventListener("input", (e) => {
      const url = e.target.value.trim();
      if (url) {
        imagePreview.src = url;
        imagePreviewContainer.classList.remove("hidden");
      } else {
        imagePreviewContainer.classList.add("hidden");
      }
    });

    inputFileUpload.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 1024 * 1024) {
        alert("Veuillez choisir une image inférieure à 1 Mo.");
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        inputImageUrl.value = ev.target.result;
        imagePreview.src = ev.target.result;
        imagePreviewContainer.classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    });

    btnRemoveImage.addEventListener("click", () => {
      inputImageUrl.value = "";
      inputFileUpload.value = "";
      imagePreviewContainer.classList.add("hidden");
    });

    // Rich Text Toolbar Commands
    document.querySelectorAll(".btn-tool").forEach(btn => {
      btn.addEventListener("click", () => {
        const cmd = btn.getAttribute("data-cmd");
        const val = btn.getAttribute("data-val") || null;
        document.execCommand(cmd, false, val);
        editorContent.focus();
      });
    });

    document.getElementById("btnInsertLink").addEventListener("click", () => {
      const url = prompt("Adresse URL du lien :");
      if (url) {
        document.execCommand("createLink", false, url);
      }
    });

    // Search & Filter
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderBoard();
    });

    window.filterByTag = (tag) => {
      activeTagFilter = tag;
      renderBoard();
      updateTagsBar();
    };

    window.editNote = (id) => {
      const n = notes.find(item => item.id === id);
      if (n) openModal(n);
    };

    window.toggleLike = async (id, currentLikes) => {
      try {
        await updateDoc(doc(db, "digipad_notes", id), {
          likes: currentLikes + 1
        });
        confetti({ particleCount: 15, spread: 45, origin: { y: 0.9 } });
      } catch (err) {
        console.error("Like error:", err);
      }
    };

    // Modal listeners
    btnNewNote.addEventListener("click", () => openModal());
    btnCloseModal.addEventListener("click", closeModal);
    btnCancelModal.addEventListener("click", closeModal);

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
